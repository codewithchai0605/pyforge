name: Build & release APK

# Push a tag such as v1.0.4 to build and publish a signed release APK. You can
# also run this workflow manually and optionally choose the release tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (empty = release-<run number>)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The generated APK filename differs across Android Gradle Plugin versions.
  # The verification step copies the signed output to this stable artifact path.
  APK_PATH: dist/app-release.apk

jobs:
  build:
    name: Build signed app-release.apk
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      # Chaquopy runs pip on the build machine, and its Python minor version must
      # match the app's (3.13, see pyruntime.gradle).
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.13"

      # cordova-android 15 / AGP 8.10 need JDK 17+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # cordova-android 15 targets SDK 36 and wants build-tools >= 36.0.0.
      # The NDK and CMake build libpyforge_pty.so, the pseudo-terminal behind
      # the Terminal page (src/android/cpp in the pyruntime plugin).
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1"

      # Cordova needs a system `gradle` on PATH to generate the Gradle wrapper
      # (it then uses that wrapper, also 8.14.2). Also caches ~/.gradle.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.2"
          cache-read-only: false

      # The project's gradle.properties only gives Gradle 2 GB; Chaquopy + Kotlin
      # + dexing are more comfortable with 4. ~/.gradle/gradle.properties wins.
      - name: Give Gradle more memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      # Android only permits updates signed by the exact same certificate. For
      # the first release migration, set RELEASE_* to the key used by the old
      # debug builds (or leave the old DEBUG_KEYSTORE_BASE64 secret in place;
      # its conventional Android debug credentials are used as a fallback).
      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.DEBUG_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'android' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'androiddebugkey' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'android' }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: Set RELEASE_KEYSTORE_BASE64 to the base64-encoded keystore used by the installed app." >&2
            exit 1
          fi
          mkdir -p .ci
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > .ci/release.keystore
          keytool -list -keystore .ci/release.keystore \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null
          echo "Release signing key restored and verified."

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      # Typecheck + bundle into www/js and www/css (those are gitignored).
      - name: Build web app
        run: bun run build

      # `cordova build` refuses to run without a platforms/ folder, and platforms/
      # is gitignored. `cordova prepare` restores the Android platform and the
      # plugins from package.json / config.xml (and runs the Chaquopy hook).
      - name: Add Cordova platform and plugins
        run: bun run cordova:plugins && bun run cordova prepare android

      # config.xml is the source of truth for versionCode. Increase its
      # android-versionCode for every release so Android accepts the update.
      - name: Build signed release APK
        env:
          PYFORGE_BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'android' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'androiddebugkey' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'android' }}
        # cordova-android 15 defaults release builds to AAB. Request APK
        # explicitly because this workflow publishes an installable APK. The
        # signing flags let Cordova create its signing config during preparation.
        run: |
          bun run cordova build android --release -- \
            --packageType=apk \
            --keystore="$GITHUB_WORKSPACE/.ci/release.keystore" \
            --storePassword="$RELEASE_KEYSTORE_PASSWORD" \
            --alias="$RELEASE_KEY_ALIAS" \
            --password="$RELEASE_KEY_PASSWORD"

      - name: Verify release APK
        run: |
          RELEASE_OUTPUT_DIR="platforms/android/app/build/outputs/apk/release"
          echo "Release APKs produced by Gradle:"
          find "$RELEASE_OUTPUT_DIR" -maxdepth 1 -type f -name '*.apk' -printf '  %f\n' || true

          # AGP may name the signed file app-release.apk or add ABI/flavor
          # details. Never upload an unsigned APK.
          RELEASE_APK="$(find "$RELEASE_OUTPUT_DIR" -maxdepth 1 -type f -name '*release*.apk' ! -name '*unsigned*' -print -quit)"
          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Gradle did not produce a signed release APK." >&2
            exit 1
          fi
          mkdir -p "$(dirname "$APK_PATH")"
          cp "$RELEASE_APK" "$APK_PATH"

          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner -print -quit)"
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not installed with Android build-tools." >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          ls -lh "$APK_PATH"

      - uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    # Only this job can write to the repo; the build job runs with a read-only token.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-release-apk
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_FROM_REF: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          TAG_FROM_INPUT: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          TAG="${TAG_FROM_REF:-${TAG_FROM_INPUT:-release-$RUN_NUMBER}}"
          echo "Release tag: $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run, or a tag that already has a release: replace the APK.
            gh release upload "$TAG" dist/app-release.apk --clobber
          else
            gh release create "$TAG" dist/app-release.apk \
              --target "$SHA" \
              --title "PyForge $TAG" \
              --generate-notes
          fi

# ---------------------------------------------------------------------------
# Required GitHub Actions secrets
#
#   RELEASE_KEYSTORE_BASE64  Base64 of the keystore that signed the old APK.
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
#
# To upgrade existing debug installations without an uninstall, the release key
# must be the *same key and alias* as the old debug APK. If that old key was the
# conventional Android debug key, the existing DEBUG_KEYSTORE_BASE64 secret is
# accepted temporarily and the remaining credentials default to android /
# androiddebugkey / android. Move it to the RELEASE_* secrets once verified.
#
# On Linux: base64 -w0 release.keystore
# On macOS: base64 -i release.keystore
# Never commit a keystore or its passwords.
# ---------------------------------------------------------------------------
