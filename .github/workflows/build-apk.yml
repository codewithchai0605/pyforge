name: Build & release debug APK

# Push a tag like v0.1.0  -> builds and publishes app-debug.apk to that release.
# Or run it by hand (Actions tab -> Run workflow) and optionally give a tag name;
# with no tag it publishes as "debug-<run number>".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (empty = debug-<run number>)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APK_PATH: platforms/android/app/build/outputs/apk/debug/app-debug.apk

jobs:
  build:
    name: Build app-debug.apk
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Chaquopy runs pip on the build machine, and its Python minor version must
      # match the app's (3.13, see pyruntime.gradle).
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.13"

      # cordova-android 15 / AGP 8.10 need JDK 17+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # cordova-android 15 targets SDK 36 and wants build-tools >= 36.0.0.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # Cordova needs a system `gradle` on PATH to generate the Gradle wrapper
      # (it then uses that wrapper, also 8.14.2). Also caches ~/.gradle.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.2"
          cache-read-only: false

      # The project's gradle.properties only gives Gradle 2 GB; Chaquopy + Kotlin
      # + dexing are more comfortable with 4. ~/.gradle/gradle.properties wins.
      - name: Give Gradle more memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      # Optional: sign with a stable debug key so each new APK can update the
      # previous one. Without the secret, every CI run gets a fresh random debug
      # key and Android refuses to install over an older build (uninstall first).
      # See the note below the workflow for how to create the secret.
      - name: Restore debug keystore (optional)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using the debug keystore from the DEBUG_KEYSTORE_BASE64 secret."
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret set: using a throwaway debug key."
          fi

      - name: Install JS dependencies
        run: npm ci

      # Typecheck + bundle into www/js and www/css (those are gitignored).
      - name: Build web app
        run: npm run build

      # Cordova adds the android platform and plugins from config.xml /
      # package.json, runs the Chaquopy hook, then calls Gradle.
      - name: Build debug APK
        env:
          PYFORGE_BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: npx cordova build android --debug

      - name: Check APK
        run: |
          test -f "$APK_PATH"
          ls -lh "$APK_PATH"

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    # Only this job can write to the repo; the build job runs with a read-only token.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-debug-apk
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_FROM_REF: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          TAG_FROM_INPUT: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          TAG="${TAG_FROM_REF:-${TAG_FROM_INPUT:-debug-$RUN_NUMBER}}"
          echo "Release tag: $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run, or a tag that already has a release: replace the APK.
            gh release upload "$TAG" dist/app-debug.apk --clobber
          else
            gh release create "$TAG" dist/app-debug.apk \
              --target "$SHA" \
              --title "PyForge $TAG" \
              --generate-notes
          fi

# ---------------------------------------------------------------------------
# Optional stable debug key (one-time setup)
#
#   keytool -genkeypair -v -keystore debug.keystore -storepass android \
#     -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
#     -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
#   base64 -w0 debug.keystore      # macOS: base64 -i debug.keystore
#
# Paste the output into Settings -> Secrets and variables -> Actions ->
# New repository secret, named DEBUG_KEYSTORE_BASE64. Never commit the keystore.
# ---------------------------------------------------------------------------
